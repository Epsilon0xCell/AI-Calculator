<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Orbital rings, rain gauges, and a gondola crossing above the clouds">
<rect width="1200" height="260" fill="#241c44"/>
<!-- far band: orbital rings, star chart crosses, rods -->
<g name="orbital-rings" fill="none" stroke="#8f8ab0" stroke-width="1.6" opacity="0.8">
  <ellipse cx="600" cy="66" rx="560" ry="46">
    <animateTransform attributeName="transform" type="rotate" values="0 600 66;2 600 66;0 600 66" dur="26s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600" cy="80" rx="430" ry="34"/>
  <ellipse cx="600" cy="54" rx="680" ry="58" opacity="0.5"/>
</g>
<g name="star-crosses" stroke="#d6d8e8" stroke-width="1.6">
  <path d="M120 30v14M113 37h14"/><path d="M340 18v12M334 24h12"/><path d="M880 26v14M873 33h14"/>
  <path d="M1060 44v12M1054 50h12"/><path d="M560 40v10M555 45h10"/><path d="M740 16v12M734 22h12"/>
</g>
<g name="lightning-rods" stroke="#c4783a" stroke-width="2.4">
  <line x1="90" y1="120" x2="90" y2="66"><animate attributeName="x1" values="90;91;90" dur="3.1s" repeatCount="indefinite"/></line>
  <line x1="1110" y1="126" x2="1110" y2="72"><animate attributeName="x1" values="1110;1109;1110" dur="2.7s" repeatCount="indefinite"/></line>
</g>
<!-- mid band: rain gauges filling a notch, vanes turning -->
<g name="rain-gauges">
  <g transform="translate(180 96)"><rect width="22" height="58" fill="none" stroke="#c8cedc" stroke-width="2"/><rect x="3" y="40" width="16" height="15" fill="#a8b4d8"><animate attributeName="y" values="40;30;30;40" dur="9s" repeatCount="indefinite"/><animate attributeName="height" values="15;25;25;15" dur="9s" repeatCount="indefinite"/></rect></g>
  <g transform="translate(252 96)"><rect width="22" height="58" fill="none" stroke="#c8cedc" stroke-width="2"/><rect x="3" y="46" width="16" height="9" fill="#a8b4d8"><animate attributeName="y" values="46;36;36;46" dur="13s" begin="2s" repeatCount="indefinite"/><animate attributeName="height" values="9;19;19;9" dur="13s" begin="2s" repeatCount="indefinite"/></rect></g>
  <g transform="translate(930 96)"><rect width="22" height="58" fill="none" stroke="#c8cedc" stroke-width="2"/><rect x="3" y="42" width="16" height="13" fill="#a8b4d8"><animate attributeName="y" values="42;33;33;42" dur="11s" begin="4s" repeatCount="indefinite"/><animate attributeName="height" values="13;22;22;13" dur="11s" begin="4s" repeatCount="indefinite"/></rect></g>
</g>
<g name="weather-vanes" stroke="#c8cedc" stroke-width="2.4">
  <g transform="translate(420 118)"><line x1="0" y1="0" x2="0" y2="34"/><g><animateTransform attributeName="transform" type="rotate" values="0;50;-20;0" dur="14s" repeatCount="indefinite"/><line x1="-20" y1="0" x2="20" y2="0"/><polygon points="20,0 10,-5 10,5" fill="#c8cedc"/></g></g>
  <g transform="translate(790 124)"><line x1="0" y1="0" x2="0" y2="30"/><g><animateTransform attributeName="transform" type="rotate" values="20;-30;20" dur="17s" repeatCount="indefinite"/><line x1="-18" y1="0" x2="18" y2="0"/><polygon points="18,0 8,-5 8,5" fill="#c8cedc"/></g></g>
</g>
<!-- cloud tops -->
<g name="cloud-tops" fill="#83869a">
  <ellipse cx="120" cy="252" rx="220" ry="42"/><ellipse cx="430" cy="258" rx="260" ry="46" fill="#74778e"/>
  <ellipse cx="760" cy="250" rx="250" ry="44"/><ellipse cx="1080" cy="258" rx="240" ry="46" fill="#74778e"/>
</g>
<path d="M60 224 Q 300 208 520 220" stroke="#c4783a" stroke-width="3" fill="none"/>
<!-- near band: the gondola crossing, beacon pulsing twice -->
<g name="gondola-crossing">
  <animateTransform attributeName="transform" type="translate" values="-260 0;1460 0" dur="40s" repeatCount="indefinite"/>
  <g stroke="#d8d4e6" stroke-width="2.4">
    <line x1="60" y1="96" x2="30" y2="-40"/><line x1="110" y1="96" x2="100" y2="-40"/>
    <line x1="170" y1="96" x2="185" y2="-40"/><line x1="220" y1="96" x2="255" y2="-40"/>
  </g>
  <rect x="118" y="78" width="46" height="16" fill="none" stroke="#8a8e9e" stroke-width="3"/>
  <polygon points="55,96 225,96 195,168 85,168" fill="#463468"/>
  <g stroke="#6a5896" stroke-width="3"><line x1="62" y1="114" x2="218" y2="114"/><line x1="70" y1="132" x2="210" y2="132"/><line x1="78" y1="150" x2="202" y2="150"/></g>
  <line x1="55" y1="96" x2="225" y2="96" stroke="#c4783a" stroke-width="4"/>
  <path name="skirt-ripple" d="M85 168 Q 110 180 140 168 T 195 168" fill="none" stroke="#9690b4" stroke-width="3">
    <animate attributeName="d" values="M85 168 Q 110 180 140 168 T 195 168;M85 168 Q 110 156 140 168 T 195 168;M85 168 Q 110 180 140 168 T 195 168" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle name="beacon" cx="225" cy="92" r="7" fill="#f5f8ff">
    <animate attributeName="opacity" values="1;0.15;1;0.15;1;1" keyTimes="0;0.08;0.16;0.24;0.32;1" dur="40s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
